name: Dev29 KBL historical player-game collection
on:
  push:
    branches: [audit/nba-kbl-dev29-public-join]
    paths: [research/dev29_source_ingest/kbl_bulk_historical.py,.github/workflows/dev29-kbl-history.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Collect bounded official box scores, minimum 1 second between requests
        run: python research/dev29_source_ingest/kbl_bulk_historical.py
      - name: Commit normalized factual research observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/dev29_source_ingest
          git diff --cached --quiet || { git commit -m "data: verified KBL game box score research with pcode and source hashes" && git push; }
