name: Dev29 KBL documented public API headers
on:
  push:
    branches: [audit/nba-kbl-dev29-public-join]
    paths: [research/dev29_source_ingest/kbl_probe_documented_headers.py,.github/workflows/dev29-kbl-documented.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python research/dev29_source_ingest/kbl_probe_documented_headers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/dev29_source_ingest
          git diff --cached --quiet || { git commit -m "data: KBL documented API observed source sample" && git push; }
