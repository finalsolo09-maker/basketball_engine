name: NBA-KBL engine regression checks

on:
  push:
    branches:
      - audit/nba-kbl-20261110-core-fixes
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install testing dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and import checks
        run: |
          python -m compileall -q main.py src data tests
          python -c "import src.models.trainer; import src.features.blocks; import src.db_audit"
      - name: Regression and end-to-end tests
        run: python -m pytest -q
