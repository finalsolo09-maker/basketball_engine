name: Dev29 NBA 411 season team evidence crosswalk
on:
  push:
    branches: [audit/nba-kbl-dev29-public-join]
    paths: [research/dev29_source_ingest/link_nba_seasons.py,.github/workflows/dev29-nba-seasons.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python research/dev29_source_ingest/link_nba_seasons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/dev29_source_ingest
          git diff --cached --quiet || { git commit -m "data: NBA 411 season game-log played teams with provenance" && git push; }
