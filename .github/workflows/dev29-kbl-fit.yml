name: Dev29 actual KBL players plus tactical metrics date-only ablation
on:
  push:
    branches: [audit/nba-kbl-dev29-public-join]
    paths: [research/dev29_source_ingest/fit_kbl_player_tactics.py,.github/workflows/dev29-kbl-fit.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'scipy>=1.12,<2'
      - run: python research/dev29_source_ingest/fit_kbl_player_tactics.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/dev29_source_ingest
          git diff --cached --quiet || { git commit -m "research: actual KBL player and tactical holdout ablation" && git push; }
