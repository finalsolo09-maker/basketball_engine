name: Dev29 alternative public roster source
on:
  push:
    branches: [audit/nba-kbl-dev29-public-join]
    paths: [research/dev29_source_ingest/probe_alt_rosters.py,.github/workflows/dev29-alt-probe.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  fetch-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python research/dev29_source_ingest/probe_alt_rosters.py
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add research/dev29_source_ingest
          git diff --cached --quiet || { git commit -m "data: dev29 secondary roster observations" && git push; }
