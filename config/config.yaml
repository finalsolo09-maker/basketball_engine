seed: 42
n_jobs: 1

league_configs:
  NBA:
    regulation_minutes: 48
    season_start_month: 10
    rest_days_default: 3
    rest_days_cap: 7
    elo_init: 1500
    elo_k: 20.0
    elo_hfa: 100.0
    use_mov_adjustment: true
    new_season_blend: 0.7
    league_priors:
      pace: 99.0
      ortg: 114.0
      pts: 112.0
    team_aliases:
      GSW: "Golden State Warriors"
      LAL: "Los Angeles Lakers"
  KBL:
    regulation_minutes: 40
    season_start_month: 10
    rest_days_default: 3
    rest_days_cap: 7
    elo_init: 1500
    elo_k: 20.0
    elo_hfa: 80.0
    use_mov_adjustment: true
    new_season_blend: 0.7
    league_priors:
      pace: 72.0
      ortg: 108.0
      pts: 81.0
    team_aliases:
      KCC: "Busan KCC Egis"
      MOB: "Ulsan Hyundai Mobis Phoebus"

data:
  train_include_playoff: false
  history_include_playoff: false
  validation_policy_on_error: "raise"  # raise | drop

features:
  rolling_windows: [5, 10]
  ewma_span: 10
  shrinkage_k: 5
  h2h_n: 5
  h2h_k: 5

training:
  min_train_games: 100
  test_size_ratio: 0.2
  n_splits: 5
  gap_days: 1
  margin_source: "diff"  # diff | direct
  apply_bias_correction: false
  sigma_mode: "constant"
  calibration_method: "sigmoid"
  consistency_policy: "auto"  # auto | clip_to_half | flag_only
  deploy_refit_include_holdout: false

inference:
  history_staleness_days: 10
